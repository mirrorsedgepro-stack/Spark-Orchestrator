name: Release

# Push a tag like v1.3.0 (matching package.json "version") to build installers for Windows, macOS and Linux.
# They are uploaded to a draft release, scanned (VirusTotal + Microsoft Defender block; ClamAV is reported), and the
# release is published only if the blocking scans are clean.
# Installed copies of Nexus then pick it up automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Create the (draft) release once, before any build uploads to it; parallel uploaders would otherwise each create one.
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "${GITHUB_REF_NAME#v}" \
            --notes "Nexus ${GITHUB_REF_NAME#v}. Windows: Nexus-Setup-*.exe · macOS: *-mac-arm64.dmg (Apple Silicon) or *-mac-x64.dmg (Intel) · Linux: .deb (x86_64 / arm64)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux --x64
          - os: ubuntu-24.04-arm
            args: --linux --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # VirusTotal + Microsoft Defender gate (blocking) and ClamAV (reported), then publish: see verify-and-publish.yml.
  verify:
    needs: build
    uses: ./.github/workflows/verify-and-publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
