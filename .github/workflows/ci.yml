name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Install scripts are skipped: the tests need no Electron binary or native builds.
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Syntax check
        run: for f in main.js preload.js lib/*.js renderer/app.js; do node --check "$f"; done
      - name: Bootstrap script syntax
        run: bash -n scripts/linux-bootstrap.sh
